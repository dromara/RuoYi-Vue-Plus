# Stars Web 生产部署示例
# 静态站点（stars-web dist）+ RuoYi API 反向代理
#
# 使用前：
#   1. cd stars-web && npm run build
#   2. 将 dist/ 同步到下方 root 目录
#   3. 按环境修改 server_name、upstream、root 路径
#
# include 方式（主 nginx.conf 的 http 块内）：
#   include /path/to/RuoYi-Vue-Plus/script/nginx/stars-web.conf;

upstream stars_ruoyi_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen       80;
    server_name  stars.example.com;

    # 构建产物目录（示例路径，请按实际部署修改）
    root /var/www/stars-web;
    index index.html;

    # 限制 body 大小（导入等接口可能较大）
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # SPA 路由：除 API 外均回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 开发/生产统一 API 前缀（与 stars-web vite 代理一致）
    location /dev-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://stars_ruoyi_backend/;
    }

    # 若生产环境使用 /prod-api 前缀，可取消注释并同步修改前端 baseURL
    # location /prod-api/ {
    #     proxy_set_header Host $http_host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_http_version 1.1;
    #     proxy_pass http://stars_ruoyi_backend/;
    # }

    # 禁止外网访问 actuator
    location ~ ^(/[^/]*)?/actuator {
        return 403;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
