# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  # undertow 配置
  undertow:
    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
    max-http-post-size: 1GB
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
    # 每块buffer的空间大小,越小的空间被利用越充分
    buffer-size: 512
    # 是否分配的直接内存
    direct-buffers: true
    threads:
      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
      io: 8
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 256

spring:
 application:
    name: intelligent-ticket-router

 threads:
  virtual:
     enabled: true

 ai:
  chat:
    client:
      enabled: false
  openai:
    api-key: ${api-key}
    base-url: https://api.deepseek.com
    chat:
      options:
        model: deepseek-v4-pro
        max-tokens: 800
  deepseek:
    api-key: ${api-key}
    chat:
      options:
        model: deepseek-chat

 data:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 2s
    password: pwd123

 kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${ticket.kafka.consumer-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.wudgaby.ticket.*
        spring.json.use.type.headers: false
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      ack-mode: record
      concurrency: 3

ticket:
  kafka:
    analysis-topic: ticket-analysis
    result-topic: ticket-routing-result
    consumer-group: ticket-router
    result-consumer-group: ticket-router-result
    dlt-suffix: .dlt

management:
 endpoints:
  web:
   exposure:
      include: health,info,prometheus,metrics

resilience4j:
 timelimiter:
  instances:
   ticketDecision:
      timeout-duration: 30s
 circuitbreaker:
  instances:
   ticketDecision:
      sliding-window-size: 50
      failure-rate-threshold: 80
      minimum-number-of-calls: 3  # 至少 N 次后再算失败率
      wait-duration-in-open-state: 20s
 bulkhead:
  instances:
   ticketDecision:
      max-concurrent-calls: 100

api-key: xxx
